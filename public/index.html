<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Trend to Future</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* VOICE  research instrument, same family as the team's converters (Dot Blob Type, 3D Studio)
   IDEA   an analysis bench: input dock on the left, the FTT board on the stage
   PICTURE the numbered From→Trend matrix and the Why ladder, laid out as instrument cards
   COLOUR warm grey bench, off-white cards, ink accent
   TYPE   IBM Plex Mono labels, IBM Plex Sans KR text */
:root{--bg:#D7D6D2;--surface:#EDECE9;--card:#F9F8F6;--card2:#FFFFFF;--line:#E3E1DC;--line2:#D3D0C9;--ink:#17171A;--muted:#7A776F;--faint:#A5A29A;--accent:#1B1B1E;--accent-ink:#FFFFFF;--soft:#EFEEEA;
 --r:13px;--rs:9px;--sh:0 1px 2px rgba(20,20,16,.06),0 18px 40px -22px rgba(12,12,10,.45);
 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"IBM Plex Sans","IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C0C0E;--surface:#151518;--card:#1E1E22;--card2:#26262B;--line:#2E2E35;--line2:#3A3A43;--ink:#ECEAE5;--muted:#9A978F;--faint:#6E6B64;--accent:#EFEDE8;--accent-ink:#121214;--soft:#2A2A30}}
:root[data-theme=dark]{--bg:#0C0C0E;--surface:#151518;--card:#1E1E22;--card2:#26262B;--line:#2E2E35;--line2:#3A3A43;--ink:#ECEAE5;--muted:#9A978F;--faint:#6E6B64;--accent:#EFEDE8;--accent-ink:#121214;--soft:#2A2A30}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.shell{height:100%;display:flex;flex-direction:column;padding:10px;gap:10px}
.top{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--ink);color:var(--card);font:600 13px/1 var(--mono);letter-spacing:0}
.top .sp{flex:1}
.pill{display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--muted);max-width:420px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{height:34px;padding:0 13px;border-radius:9px;cursor:pointer;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:12.5px;white-space:nowrap}
.tb:hover{color:var(--ink);border-color:var(--line2)}
.tb:focus-visible,.go:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible,.pipe a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{flex:1;min-height:0;display:grid;grid-template-columns:340px minmax(0,1fr);gap:10px}
.dock{display:flex;flex-direction:column;gap:8px;overflow-y:auto;scrollbar-width:thin;padding-right:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:9px}
.ph{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.ph b{color:var(--ink);font:600 13px/1.4 var(--sans);letter-spacing:0}
textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;font-size:13.5px;line-height:1.55;resize:vertical;min-height:150px}
textarea::placeholder{color:var(--faint)}
#resIn{min-height:110px;font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.go{height:38px;padding:0 16px;border-radius:9px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;cursor:pointer;flex:1}
.go.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line2);flex:none}
.thumb{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.thumb img{height:34px;max-width:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line2)}
.drag textarea#caseIn{border:2px dashed var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:0}.hint a{color:var(--ink)}
.status{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-height:18px}.status.err{color:var(--ink);font-weight:600}
.pipe{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:p}
.pipe a{display:grid;grid-template-columns:26px 1fr auto;align-items:center;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px}
.pipe a:hover{background:var(--soft)}
.pipe .k{font-family:var(--mono);font-size:11px;color:var(--faint)}
.pipe .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-y:auto;scrollbar-width:thin;scroll-behavior:smooth}
#out{display:grid;gap:12px;padding:14px;max-width:1240px;margin:0 auto}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2vw,26px);display:grid;gap:16px;scroll-margin-top:14px}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sh h2{margin:0;display:flex;align-items:baseline;gap:10px;font-size:16px;font-weight:600}
.sh h2 .code{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.sh h2 small{font-weight:400;color:var(--muted);font-size:13px}
.sh .tb{height:28px;font-size:11px;font-family:var(--mono)}
.head{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
.ttl{font-size:clamp(21px,2vw,27px);line-height:1.3;font-weight:700;letter-spacing:-.02em;margin:0;white-space:pre-line;text-wrap:balance}
.desc{margin:0;font-size:14px;white-space:pre-line}
.src{font-size:12.5px;color:var(--muted);margin-top:10px}
.fig{margin:0 0 12px;border-radius:var(--rs);overflow:hidden;border:1px solid var(--line)}.fig img{display:block;width:100%;max-height:220px;object-fit:cover}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.facts li{background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;display:grid;gap:4px;align-content:start}
.facts .x{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.facts b{font-size:14.5px}.facts p{margin:0;font-size:13.5px;color:var(--muted)}
.mx{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr);font-size:14px;line-height:1.7;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;background:var(--card2)}
.mx>div{padding:11px 14px;border-bottom:1px solid var(--line)}
.mx>div:nth-last-child(-n+3){border-bottom:0}
.mx .ch{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);padding-block:8px;background:var(--soft)}
.mx .ch.tr{color:var(--ink);font-weight:600}
.mx .rk{font:600 12px/1.9 var(--mono);color:var(--muted);text-align:center;padding-inline:0;background:var(--soft)}
.mx .fr{color:var(--muted)}.mx .fr b{color:var(--ink)}
.mx .tr{border-left:1px solid var(--line)}
.n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;margin:0 3px 0 1px;font:600 10.5px/1 var(--mono);color:var(--card2);background:var(--ink);border-radius:9px;vertical-align:1px}
.fr .n{background:var(--faint)}
.map{width:100%;border-collapse:collapse;font-size:13px}
.map th{text-align:left;font:500 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted);padding:6px 10px 6px 0;border-bottom:1px solid var(--line2)}
.map td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.map td:first-child{width:40px}
.map td:nth-child(2){color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.kv{display:grid;gap:8px}
.kv div{background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:11px 14px;display:grid;gap:3px}
.kv span,.root span,.angle span{font:500 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted)}
.kv p{margin:0;font-size:14px}
.ar{list-style:none;margin:0;padding:4px 0 0;display:grid}
.ar li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 10px;padding-bottom:14px;position:relative}
.ar li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:1px;background:var(--line2)}
.ar li:last-child::before{display:none}
.ar .q{font:600 11px/1 var(--mono);width:29px;height:29px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--card);position:relative}
.ar b{font-size:14px;align-self:center;font-weight:600}
.ar p{grid-column:2;margin:0;font-size:13.5px;color:var(--muted)}
.root{background:var(--ink);color:var(--card);border-radius:var(--rs);padding:16px 18px;display:grid;gap:6px}
.root span{color:var(--faint)}
.root .big{font-size:clamp(16px,1.5vw,19px);font-weight:600;line-height:1.5;margin:0}
.root .sm{font-size:13.5px;margin:0;opacity:.85}
.seeds h3{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.seeds h3 small{font-weight:400;color:var(--muted);font-size:12.5px}
.sl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sl li{background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 13px;display:grid;gap:2px}
.sl b{font-size:14px;font-weight:600}.sl p{margin:0;font-size:13px;color:var(--muted)}
.tag{font:500 10.5px/1 var(--mono);letter-spacing:.04em;border:1px solid var(--line2);border-radius:999px;padding:3px 8px;margin-right:6px;white-space:nowrap;color:var(--muted);vertical-align:2px}
.dirs{display:grid;gap:10px}
.dir{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px 16px;background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:16px}
.dir .qh{grid-column:1 / -1;display:grid;gap:6px}
.dir .qh .meta{font-size:12.5px;color:var(--muted)}
.dir .qh h3{margin:0;font-size:clamp(16px,1.6vw,19px);line-height:1.45;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hev3{display:grid;grid-template-columns:22px minmax(0,1fr);font-size:13.5px}
.hev3>div{padding:8px 0;border-top:1px solid var(--line)}
.hev3 .rk{font:600 11.5px/1.9 var(--mono);color:var(--muted)}
.aidv{display:grid;align-content:start;font-size:13px}
.aidv div{display:grid;grid-template-columns:30px minmax(0,1fr);padding:8px 0;border-top:1px solid var(--line)}
.aidv div>b{font:600 11.5px/1.75 var(--mono);color:var(--muted)}
.angle{margin:10px 0 0;font-size:13.5px;background:var(--soft);border-radius:8px;padding:10px 12px}.angle span{display:block;margin-bottom:2px}
.basis{margin:0;font-size:13px;color:var(--muted)}.basis span{font:500 11px/1 var(--mono);letter-spacing:.06em;border:1px solid var(--line2);border-radius:999px;padding:3px 8px;margin-right:8px}
.head .desc{margin-top:12px}
.spec{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.spec div{background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:9px 12px}
.spec dt{font:500 10.5px/1.4 var(--mono);letter-spacing:.06em;color:var(--muted)}.spec dd{margin:2px 0 0;font-size:13px;font-weight:500}
.facts .x em{font-style:normal;margin-left:8px;color:var(--ink)}
.facts .why{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line2);padding-top:6px;margin-top:4px}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:rgba(127,127,127,.35);margin-top:10px;border-radius:8px;overflow:hidden}
.parts div{background:var(--ink);padding:10px 12px;display:grid;gap:3px;align-content:start}
.parts p{margin:0;font-size:13px}
.push{font:500 11.5px/1.5 var(--mono)!important;color:var(--ink)!important}
.dirs{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))!important}
.dir{grid-template-columns:minmax(0,1fr)!important;align-content:start}
.ctx{margin:2px 0 0;font-size:12.5px;color:var(--muted)}.ctx::before{content:"상황 · ";font-family:var(--mono);font-size:11px}
.dmeta{margin:0;display:grid;font-size:13px}
.dmeta div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.dmeta dt{font:500 11px/1.8 var(--mono);color:var(--muted);letter-spacing:.02em}.dmeta dd{margin:0}
.ck{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:6px}
.ck li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 10px;background:var(--card2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px}
.ck .mk{grid-row:span 2;font:600 11px/1 var(--mono);display:grid;place-items:center;border-radius:6px;height:26px;background:var(--ink);color:var(--card)}
.ck li.no .mk{background:none;color:var(--ink);border:1px dashed var(--ink)}
.ck b{font-size:13.5px;font-weight:600}.ck p{margin:0;font-size:12.5px;color:var(--muted)}
#out{gap:10px}.sheet{gap:14px}
@media(max-width:900px){.parts,.spec{grid-template-columns:minmax(0,1fr)}.dmeta div{grid-template-columns:minmax(0,1fr);gap:0}}
[contenteditable]{border-radius:4px}
[contenteditable]:hover{background:var(--soft)}
.root [contenteditable]:hover{background:rgba(127,127,127,.25)}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);padding:0;width:min(520px,92vw);box-shadow:var(--sh)}
dialog::backdrop{background:rgb(0 0 0/.35)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.hist{list-style:none;margin:0;padding:6px;max-height:60vh;overflow:auto}
.hist li{display:flex;border-radius:8px}
.hist .o{flex:1;text-align:left;background:none;border:0;padding:11px 12px;cursor:pointer;border-radius:8px}
.hist .o:hover{background:var(--soft)}
.hist small{display:block;color:var(--muted);font-size:11.5px}
.hist .d{background:none;border:0;color:var(--muted);width:52px;cursor:pointer;font-size:12px}
@media(max-width:900px){body{overflow:auto}html,body{height:auto}.shell{height:auto}.app{grid-template-columns:minmax(0,1fr)}.stage{overflow:visible}.pill{display:none}.head,.two,.dir{grid-template-columns:minmax(0,1fr)}.mx{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr);font-size:13px}.mx>div{padding:9px 8px}.brand span{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark">FT</span><span>FROM TREND TO FUTURE</span></div>
    <div class="pill"><span class="dot"></span><span id="curCase">예시</span></div>
    <div class="sp"></div>
    <button class="tb" id="histBtn" type="button">기록</button>
    <button class="tb" id="copyMd" type="button">MD 복사</button>
    <button class="tb" id="saveMd" type="button">MD 저장</button>
    <button class="tb" id="pngAll" type="button">PNG 전체</button>
  </header>
  <div class="app">
    <aside class="dock">
      <section class="panel" id="inPanel">
        <div class="ph"><b>01 사례 입력</b><span>CASE</span></div>
        <textarea id="caseIn" placeholder="사례 이름, 기존과 달라진 점, 기술·수치, 사용자 경험 변화"></textarea>
        <div class="row"><button class="go" id="copyPrompt" type="button">프롬프트 복사</button><button class="go ghost" id="pick" type="button">이미지</button><span class="thumb" id="thumb" hidden><img id="thumbImg" alt=""><button class="tb" id="unpick" type="button">빼기</button></span></div>
        <p class="hint">복사한 프롬프트를 <a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a>나 <a href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a>에 붙여 넣어요.</p>
      </section>
      <section class="panel">
        <div class="ph"><b>02 AI 답 붙여넣기</b><span>JSON</span></div>
        <textarea id="resIn" placeholder="받은 답을 그대로 붙여 넣기"></textarea>
        <button class="go" id="go" type="button">분석 보드 만들기</button>
        <div class="status" id="status"></div>
      </section>
      <section class="panel">
        <div class="ph"><b>03 분석 단계</b><span>PIPELINE</span></div>
        <ol class="pipe" id="pipe"></ol>
      </section>
      <input type="file" id="file" accept="image/*" hidden>
    </aside>
    <main class="stage" id="stage"><div id="out"></div></main>
  </div>
</div>

<dialog id="dlg">
  <div class="dh">HISTORY<button class="tb" id="dlgClose" type="button">닫기</button></div>
  <ul class="hist" id="histList"></ul>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
{
const EXAMPLE={
 case:{title:"Mercedes-Benz SKY CONTROL 파노라믹 루프",source:"Mercedes-Benz GLC 2026 · Research Frontiers SPD-SmartGlass",
  headline:"좌석마다 다른 빛을 허락하는\n9구역 스마트 글라스 루프의\n개인 조도 제어",
  description:"Research Frontiers의 SPD-SmartGlass 기술로 루프 유리를 9개 구역으로 나누고, 각 구역의 투명도를 4단계로 조절한다. 기존 파노라믹 루프는 덮개 전체를 열거나 닫는 방식이었지만, 이 사례는 좌석별로 빛 투과를 다르게 제어한다.",
  specs:[{k:"기술",v:"SPD-SmartGlass (전기 신호 기반 투과도 제어 유리)"},{k:"제어 단위",v:"루프 9개 구역"},{k:"제어 단계",v:"구역별 4단계 투명도"},{k:"사용자 역할",v:"좌석별로 자기 머리 위 구역을 직접 선택"}]},
 facts:[{core:"제어 단위 분할",text:"파노라믹 루프를 9개 독립 구역으로 세분화하여 개별 제어",why:"하나의 덮개가 전체를 가리던 일괄 구조가 구역 단위 구조로 바뀌었다.",ftt:"FTT-1"},

function htmlToMd(h){
  const t=document.createElement("textarea");
  t.innerHTML=h.replace(/<span class="n">(\d)<\/span>/g,"($1)").replace(/<\/?(b|strong)>/gi,"**").replace(/<br\s*\/?>/gi,"\n").replace(/<\/(div|p)>/gi,"\n").replace(/<[^>]+>/g,"");
  return t.value.replace(/\*\*\*\*/g,"").replace(/\n+$/,"");
}
$("#out").addEventListener("focusout",e=>{const el=e.target.closest("[data-p]");if(!el)return;
  const v=htmlToMd(el.innerHTML);if(v!==get(data,el.dataset.p)){put(data,el.dataset.p,v);saveHist()}});

const PROMPT=(caseText,hasImg)=>`너는 LG AIDV(AI-Defined Vehicle) 산학 프로젝트의 FTT(From-Trend-To) 분석가다. 아래 사례를 FTT 작성 가이드와 HEV 작성 가이드에 따라 끝까지 분석하고, 마지막에 JSON 하나만 출력한다.

[사례]
${caseText}
${hasImg?"\n(사례 이미지를 이 대화에 함께 첨부했다. 이미지도 사례 자료로 읽는다.)\n":""}
[목적]
FTT는 사례 요약이 아니다. 사례 고유의 구조적 전환 원리를 뽑고, 그 원리를 AIDV 차량 경험으로 증폭할 시드까지 만드는 것이다. T는 솔루션이 아니라 시드다. "개인화가 중요하다", "편리해진다"처럼 어느 사례에나 붙는 결론은 실패다.

[진행 순서]
0. 사례 스펙: 기술명, 제어 단위·수치, 작동 방식, 사용자 역할을 사례에서 확인되는 만큼만 정리한다.
1. Fact 추출: 사례에서 기존과 구조적으로 다른 변화만 뽑는다. 서로 독립적인 변화축만 남긴다(단순한 사례 1~2개, 복잡한 사례 3~5개). 각 Fact는 기존 대비 무엇이 구조적으로 달라졌는지(why), 다른 Fact를 빼도 성립하는지 통과해야 하고, 어느 FTT로 이어지는지 적는다.
2. FTT 생성: 독립적인 변화축 하나당 FTT 하나(보통 1~2개). From = Trend 직전의 가장 앞선 양산 수준(SOTA)의 작동 구조와 한계. basis에 From으로 잡은 직전 방식을 적는다. "나빴다/불편했다" 같은 평가어 금지. Trend = 사례가 바꾼 것. 기술명·수치·물리 구조·제어 단위·작동 방식·사용자 역할 변화를 넣는다.
3. H-E-V
 - H(How): 관찰 가능한 팩트만. 구조·속성·위치·단위·센서·출력·입력·사용자 행위. "편하게/자연스럽게/AI가 알아서" 금지. 반드시 "~하여"로 끝난다.
 - E(Effect): H 때문에 생기는 객관적 작동 변화만(정보 흐름, 물리 전달, 제어 단위, 인지 구조, 조작 단계). "편해진다/안심한다/별도 조작 없이" 같은 사용자 효용은 E에 쓰지 않는다. 반드시 "~하여"로 끝난다.
 - V(Value): E의 결과로 사용자가 얻는 가치와 인식 변화. 차량을 어떻게 새롭게 인식하게 되는지까지. 반드시 "~한다"로 끝난다.
 - H에 없는 것이 E에, E에 없는 것이 V에 튀어나오면 안 된다.
4. 번호 매핑(가장 중요): H 안의 핵심 요소를 (1)(2)(3)으로 쪼갠다. From의 (n)과 Trend의 (n)은 반드시 같은 축을 가리키며 1:1로 대응한다. 한쪽에만 있는 번호 금지. H의 번호 축은 E와 V에서도 같은 번호로 이어진다. 번호마다 매핑 노트(변화축 이름, From 요소 → Trend 요소, 무엇이 무엇으로 바뀌었나 한 줄)를 쓴다.
5. T 해부(가장 강한 FTT 하나를 깊게): 변화축(무엇이 무엇으로 바뀌었나 한 문장), 메커니즘(왜 가능해졌나, 기술·구조 원인), 한계(아직 못 간 지점, 강화의 출발점).
6. AR: Why를 3~4회 반복해 근원 원리에 닿는다. 도메인 수준의 구체성을 유지하고 철학으로 올라가지 않는다.
7. 근원 원리 한 줄, 보편화 모델 한 줄과 그 4파트(상황·조건 / 충돌·한계 / 구조적 조정 / 새로운 가치): "[상황/조건]에서 [충돌/한계]가 발생할 때, [구조적 조정 방식]을 통해 [새로운 가치/상태]로 전환한다." 너무 넓지 않게 구조를 남긴다.
8. 강화 시드 5~6개: 같은 변화축을 극단으로 민다(세분화, 연속값, 자동화, 개인 학습, 가변, 전체). 각 시드에 유형과 "Trend 값 → 밀어붙인 값"을 쓴다. 감각·대상·도메인이 바뀌면 강화가 아니다.
9. 확장 시드 5~6개: 근원 원리를 다른 감각(소리·온도·향·촉감), 다른 대상(시트·도어·대시보드·스티어링), 관계(탑승자 간 조율), 다른 시간(탑승 전·정차 중·하차 후), 차량 외부(보행자·도로·인프라), 디지털 인터페이스로 옮긴다. 원리의 구조는 유지한다. domain에 옮긴 곳, keep에 유지한 원리 구조를 쓴다.
10. 방향 제안 4개(강화에서 2개, 확장에서 2개): 제목은 "맥락 적용", "감각 전환" 같은 카테고리가 아니라 그 시드만의 도발적 질문. 각 방향마다 차량 안에서 실제로 벌어지는 시나리오 HEV(같은 어미 규칙), 축을 살짝 튼 다른 각도, AIDV 적용(D1 트렌드 / D2 기술 / D3 니즈를 구체 이름으로).
 - D2 기술 예: DMS, Vital Sensing, AI Sound, 헤드레스트 스피커, AI 캐빈 플랫폼, ThinQ, TOLED 파노라마, Shy Tech, AR HUD, Ambient Light, AVS 비전 솔루션
 - D1 트렌드 예: 1.5가구, 제로클릭, 필코노미, 건강지능HQ, 픽셀라이프, 페이스테크
 - D3 니즈 예: 졸음 감지, 탑승자 간 충돌 조율, 수면 환경, 불편 자동 감지
 - 각 방향에 상황(언제·누가·어디서 한 줄), AI의 역할(감지·판단·예측·조율하는 대상), 왜 차량이어야 하는지(좌석·캐빈·주행·도착·동승자·감각 환경)를 따로 쓴다.
11. 최종 체크리스트: 아래 10개 항목을 네 결과에 스스로 적용해 통과(ok:true) 또는 보완(ok:false)과 한 줄 근거를 쓴다. 억지로 다 통과시키지 않는다.
 독립적인 Fact를 추출했는가 / From이 기존 구조의 한계를 구체적으로 보여주는가 / Trend에 기술명·수치·구조 변화가 있는가 / From과 Trend의 번호가 1:1로 대응하는가 / H의 번호축이 E·V까지 이어지는가 / AR이 도메인 수준의 근원 원리에 닿았는가 / 보편화 모델이 너무 넓지 않은가 / 강화가 같은 축을 밀고 확장이 다른 곳으로 옮겼는가 / 방향 제목이 시드 고유의 질문인가 / AIDV 적용이 D1·D2·D3로 구체 연결되는가

[좋은 예시: Mercedes-Benz SKY CONTROL]
From H: (1)물리적 덮개를 (2)전체 단일 구역에 (3)2단계(열림·닫힘)로 조절하여
Trend H: (1)전기 신호 기반 스마트 글라스를 (2)9개 독립 구역으로 나누고 (3)4단계 투명도로 제어하여
매핑: (1) 제어 수단 기계적 차단→전기적 투과도 / (2) 제어 단위 일괄→분할 / (3) 제어 정밀도 이진→다단계
근원 원리: 공유 환경에서 개인 활동 맥락이 다를 때, 환경의 제어 해상도를 높여 개인별 최적 조건을 분리 제공한다.

[문장 규칙]
보고서체. 엠대시(—) 금지. 굵게(**)는 꼭 필요한 핵심어에만. 모르는 수치·연도는 지어내지 않는다. headline은 2~3줄(\\n), 명사로 끝나는 무게 있는 제목.

[출력]
설명 없이 아래 JSON 하나만, 코드 블록 하나로 출력한다.
{"case":{"title":"짧은 사례명","source":"브랜드·기술(모르면 빈 문자열)","headline":"","description":"3~4문장, 사실만","specs":[{"k":"기술","v":""},{"k":"제어 단위·수치","v":""},{"k":"작동 방식","v":""},{"k":"사용자 역할","v":""}]},
"facts":[{"core":"변화 핵심 2~4단어","text":"한 문장","why":"기존 대비 무엇이 구조적으로 달라졌는지 한 문장","ftt":"FTT-1"}],
"ftts":[{"id":"FTT-1","core":"변화 핵심 2~4단어","basis":"From으로 잡은 직전 방식(제품·기술명)","from":{"h":"(1)… (2)… (3)…하여","e":"(1)… (2)…하여","v":"(1)… (2)…한다"},"trend":{"h":"","e":"","v":""},"map":[{"n":"(1)","axis":"변화축 이름(예: 제어 수단)","f":"From 요소","t":"Trend 요소","c":"무엇이 무엇으로 바뀌었나"}]}],
"amp":{"target":"FTT-1","axis":"","mechanism":"","limit":"","ar":[{"q":"왜 …?","a":"…때문이다."}],"principle":"","model":"","parts":{"cond":"상황·조건","conflict":"충돌·한계","method":"구조적 조정 방식","value":"새로운 가치·상태"}},
"reinforce":[{"name":"","type":"세분화|연속값|자동화|개인 학습|가변|전체 중 하나","push":"Trend 값 → 밀어붙인 값","desc":"한 문장"}],
"expand":[{"name":"","domain":"옮긴 감각·대상·시간·공간","keep":"유지한 원리 구조","desc":"한 문장"}],
"directions":[{"seed":"시드 이름","type":"강화 또는 확장","question":"","context":"언제·누가·어디서 한 줄","hev":{"h":"","e":"","v":""},"ai":"AI가 감지·판단·예측·조율하는 대상","why_car":"왜 차량이어야 하는가 한 줄","angle":"","aidv":{"d1":"","d2":"","d3":""}}],
"check":[{"item":"","ok":true,"note":""}]}`;

const valid=o=>o?.case&&L(o.ftts).length&&o.ftts.every(f=>f.from&&f.trend);
function setStatus(t,err){const s=$("#status");s.textContent=t;s.classList.toggle("err",!!err)}
function parseResult(raw){
  const a=raw.indexOf("{"),b=raw.lastIndexOf("}");if(a<0||b<a)throw{message:"JSON이 안 보여요. 답 전체를 복사해 붙여 주세요."};
  let o;try{o=JSON.parse(raw.slice(a,b+1))}catch(e){throw{message:"답을 읽지 못했어요. 답이 중간에 끊겼다면 AI에게 '이어서'라고 한 뒤 전체를 붙여 주세요."}}
  if(!valid(o))throw{message:"FTT가 빠져 있어요. AI에게 '형식 그대로 JSON만 다시'라고 해 주세요."};
  o.facts=L(o.facts);o.reinforce=L(o.reinforce);o.expand=L(o.expand);o.directions=L(o.directions);o.amp=o.amp||{};o.amp.ar=L(o.amp.ar);
  o.ftts.forEach(f=>{f.map=L(f.map)});o.check=L(o.check);o.case.specs=L(o.case.specs);o.directions.forEach(r=>{r.hev=r.hev||{};r.aidv=r.aidv||{}});return o;
}
$("#copyPrompt").onclick=async()=>{
  const text=$("#caseIn").value.trim();if(!text){setStatus("사례를 먼저 넣어 주세요.",true);return}
  const b=$("#copyPrompt");try{await navigator.clipboard.writeText(PROMPT(text,!!imgBlob));b.textContent="복사됨";setStatus(imgBlob?"AI 창에 붙여 넣고 이미지도 같이 올려 주세요.":"AI 창에 붙여 넣어 주세요.")}catch(e){b.textContent="복사 안 됨"}
  setTimeout(()=>b.textContent="프롬프트 복사",1600);
};
function generate(){
  try{const o=parseResult($("#resIn").value);if(imgUrl)o.img=imgUrl;data=o;curId=Date.now();render();saveHist();$("#resIn").value="";
    setStatus("완료. 글자를 눌러 고칠 수 있어요.");$("#stage").scrollTo({top:0,behavior:"smooth"})}
  catch(e){setStatus(e.message||"실패했어요.",true)}
}
$("#go").onclick=generate;
$("#resIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))generate()});

function saveHist(){if(!curId)return;let h=store.get("ftf-hist3",[]).filter(x=>x.id!==curId);h.unshift({id:curId,t:new Date().toISOString(),data});store.set("ftf-hist3",h.slice(0,30))}
function openHist(){
  const h=store.get("ftf-hist3",[]);
  $("#histList").innerHTML=h.length?h.map(x=>`<li><button class="o" data-id="${x.id}" type="button">${esc(x.data.case.title)}<small>${new Date(x.t).toLocaleString("ko-KR")} · ${esc(x.data.amp?.principle||"")}</small></button><button class="d" data-del="${x.id}" type="button">삭제</button></li>`).join(""):'<li style="padding:20px;color:var(--mute)">아직 없어요.</li>';
  $("#dlg").showModal();
}
$("#histList").addEventListener("click",e=>{
  const o=e.target.closest("[data-id]"),d=e.target.closest("[data-del]"),h=store.get("ftf-hist3",[]);
  if(o){const x=h.find(x=>x.id==o.dataset.id);if(x){data=x.data;curId=x.id;render();$("#dlg").close()}}
  if(d){store.set("ftf-hist3",h.filter(x=>x.id!=d.dataset.del));openHist()}
});
$("#histBtn").onclick=openHist;$("#dlgClose").onclick=()=>$("#dlg").close();

$("#caseIn").value=store.get("ftf-draft","");
$("#caseIn").addEventListener("input",()=>store.set("ftf-draft",$("#caseIn").value));
async function takeImg(f){if(!f||!f.type?.startsWith("image/"))return;
  try{const bmp=await createImageBitmap(f),k=Math.min(1,1200/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    imgUrl=c.toDataURL("image/jpeg",.82);imgBlob=f}catch(e){setStatus("이미지를 읽지 못했어요.",true);return}
  $("#thumbImg").src=imgUrl;$("#thumb").hidden=false;$("#pick").hidden=true}
$("#pick").onclick=()=>$("#file").click();
$("#file").onchange=e=>{takeImg(e.target.files[0]);e.target.value=""};
$("#unpick").onclick=()=>{imgBlob=null;imgUrl=null;$("#thumb").hidden=true;$("#pick").hidden=false};
const col=$("#inPanel");
col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("drag")});
col.addEventListener("dragleave",()=>col.classList.remove("drag"));
col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("drag");takeImg(e.dataTransfer.files[0])});
$("#caseIn").addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/"));if(f){e.preventDefault();takeImg(f)}});

function save(filename,blob){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const slug=()=>(data.case.title||"ftt").replace(/[^\w가-힣]+/g,"_").slice(0,40);
$("#copyMd").onclick=async()=>{const b=$("#copyMd");try{await navigator.clipboard.writeText(toMarkdown(data));b.textContent="복사됨"}catch(e){b.textContent="복사 안 됨"}setTimeout(()=>b.textContent="마크다운 복사",1500)};
$("#saveMd").onclick=()=>save(`FTT_${slug()}.md`,new Blob([toMarkdown(data)],{type:"text/markdown"}));
async function png(id){
  const el=document.getElementById(id);if(!el||!window.html2canvas)return;
  const c=await html2canvas(el,{scale:2,backgroundColor:getComputedStyle(el).backgroundColor,ignoreElements:x=>x.dataset?.png!==undefined});
  const b=await new Promise(r=>c.toBlob(r,"image/png"));save(`FTT_${slug()}_${id.replace("s-","")}.png`,b);
}
$("#out").addEventListener("click",e=>{const b=e.target.closest("[data-png]");if(b)png(b.dataset.png).catch(()=>setStatus("이미지 저장에 실패했어요.",true))});
$("#pngAll").onclick=async()=>{try{setStatus("이미지 만드는 중");for(const s of document.querySelectorAll("#out .sheet")){await png(s.id);await new Promise(r=>setTimeout(r,400))}setStatus("저장했어요.")}catch(e){setStatus("이미지 저장에 실패했어요.",true)}};

render();
}
</script>
</body>
