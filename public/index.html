<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Trend to Future</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  printed analysis sheet, black ink, no decoration
   IDEA   a poster masthead over a ruled worksheet
   PICTURE the title itself, set huge and condensed; the Future column inverted
   COLOUR white and black only
   TYPE   Archivo condensed for Latin display, IBM Plex Sans KR for Korean */
:root{color-scheme:light;--bg:#ffffff;--ink:#0d0d0d;--mute:#707070;--rule:#d6d6d6;--soft:#f3f3f3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f0f0f;--ink:#f2f2f0;--mute:#8f8f8f;--rule:#333;--soft:#1a1a1a}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f0f0f;--ink:#f2f2f0;--mute:#8f8f8f;--rule:#333;--soft:#1a1a1a}
*{box-sizing:border-box;min-width:0;border-radius:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.x{font-family:Archivo,"IBM Plex Sans KR",sans-serif;font-stretch:62%;font-weight:800;letter-spacing:-.01em;line-height:.88}
.pad{padding-inline:max(3.2vw,16px)}
.mast{padding-top:28px;padding-bottom:20px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--rule)}
.mast .ln{flex:none;white-space:nowrap}.mast h1{margin:0;font-size:clamp(34px,4vw,52px);font-weight:700}
.mast h1 span{font-weight:300}
.mast nav{display:flex;gap:18px;padding-bottom:.6em}
.ln{font:inherit;font-size:14px;background:none;border:0;padding:10px 0;color:var(--ink);cursor:pointer;text-decoration:underline;text-underline-offset:4px;min-height:44px}
a.ln{display:inline-flex;align-items:center}
.ln:hover{text-decoration-thickness:2px}
button:focus-visible,textarea:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,48px);padding-top:28px;padding-bottom:32px;border-bottom:1px solid var(--rule)}
.col{display:grid;gap:10px;align-content:start}
.hint{font-size:13px;color:var(--mute)}.hint a{color:var(--ink)}
.form>div{padding:20px 0}
.form .side{padding-right:24px;border-right:1px solid var(--rule);display:grid;gap:18px;align-content:start}
.form .main{display:grid;gap:14px}
.lb{font-size:13px;font-weight:600}
textarea,input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);padding:12px 14px;width:100%}
textarea{min-height:170px;resize:vertical;line-height:1.6}
textarea::placeholder,input::placeholder{color:var(--mute)}
.opt{display:grid;gap:2px}
.opt label{display:flex;gap:10px;align-items:center;font-size:14px;min-height:36px;cursor:pointer}
.opt input[type=radio]{accent-color:var(--ink);width:16px;height:16px;margin:0}.opt input[type=text]{width:100%;min-height:44px}
.file{font-size:14px;display:flex;gap:10px;align-items:center;min-height:44px}
.file img{width:44px;height:32px;object-fit:cover}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.go{font:inherit;font-weight:600;font-size:15px;background:var(--ink);color:var(--bg);border:0;min-height:46px;padding:0 24px;cursor:pointer}
.go:disabled{opacity:.35;cursor:default}
.thumb{display:inline-flex;gap:10px;align-items:center}.thumb[hidden]{display:none}.thumb img{height:44px;width:auto;max-width:80px;object-fit:cover;border:1px solid var(--ink)}
.drag #caseIn{border-style:dashed;border-width:2px}
.fig{margin:0;border:1px solid var(--rule)}.fig img{display:block;width:100%;max-height:220px;object-fit:cover}
.status{font-size:13px;color:var(--mute)}
.status.err{color:var(--ink);font-weight:600}
.tools{display:flex;gap:20px;justify-content:flex-end;flex-wrap:wrap;padding-top:8px}
.sheet{margin:12px 0 80px;background:var(--bg);padding:clamp(18px,2.6vw,36px);border:1px solid var(--rule);display:flex;flex-direction:column;gap:20px}
@media(min-width:1100px){.sheet{aspect-ratio:297/210}}
.sheet.loading{opacity:.35}
.head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end}
.ttl{font-size:clamp(22px,2.2vw,30px);line-height:1.22;font-weight:700;letter-spacing:-.02em;margin:0;white-space:pre-line;text-wrap:balance}
.desc{margin:0;font-size:15px;white-space:pre-line}
.src{font-size:13px;color:var(--mute);margin-top:10px}
.tbl{display:grid;grid-template-columns:36px repeat(3,minmax(0,1fr));grid-template-rows:auto repeat(3,1fr);border-top:1px solid var(--ink);flex:1;font-size:14.5px;line-height:1.62}
.tbl>div{padding:12px 16px;border-bottom:1px solid var(--rule)}
.tbl .ch{padding-top:14px;border-bottom:1px solid var(--ink)}
.tbl .ch .x{font-size:clamp(22px,2vw,28px);display:block}
.tbl .kw{display:block;font-weight:700;font-size:16px;margin-top:6px}
.tbl .rk{padding-left:0;padding-right:0;font-family:Archivo;font-stretch:62%;font-weight:700;font-size:18px;line-height:1.3}
.tbl .t{white-space:pre-line}
.tbl .fr{color:var(--mute)}
.tbl .fr b{color:var(--ink)}
.tbl .fu{background:var(--soft);border-left:2px solid var(--ink)}
.tbl .fu.body{grid-column:4;grid-row:2 / span 3;display:grid;gap:20px;align-content:start;padding-top:16px}
.tbl .fu h4{margin:0 0 6px;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.tbl .fu h4 .x{font-size:17px;font-weight:700}
.tbl .fu p{margin:0;white-space:pre-line}
.foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--mute);border-top:1px solid var(--rule);padding-top:10px}
[contenteditable]{outline-offset:2px}
[contenteditable]:hover{background:var(--soft)}
.fu [contenteditable]:hover{background:var(--bg)}
dialog{border:1px solid var(--ink);background:var(--bg);color:var(--ink);padding:0;width:min(520px,92vw)}
dialog::backdrop{background:rgb(0 0 0/.4)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;border-bottom:3px solid var(--ink)}
.dh .x{font-size:30px}
.hist{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
.hist li{display:flex;border-bottom:1px solid var(--rule)}
.hist .o{flex:1;text-align:left;font:inherit;background:none;border:0;color:var(--ink);padding:14px 20px;cursor:pointer}
.hist .o:hover{background:var(--soft)}
.hist small{display:block;color:var(--mute);font-size:12px}
.hist .d{background:none;border:0;color:var(--mute);width:52px;cursor:pointer;font-size:13px}
@media(max-width:820px){.form{grid-template-columns:minmax(0,1fr)}.head{grid-template-columns:minmax(0,1fr)}
 .tbl{grid-template-columns:28px repeat(2,minmax(0,1fr))}.tbl .fu.ch{grid-column:1 / -1;grid-row:5}.tbl .fu.body{grid-column:1 / -1;grid-row:6}}
</style>
</head>
<body>
<header class="mast pad">
  <h1 class="x">From Trend <span>to</span> Future</h1>
  <button class="ln" id="histBtn" type="button">기록</button>
</header>

<section class="form pad">
  <div class="col">
    <span class="lb">사례</span>
    <textarea id="caseIn" placeholder="사례 이름, 기사, 메모"></textarea>
    <div class="row"><button class="go" id="copyPrompt" type="button">프롬프트 복사</button><button class="ln" id="pick" type="button">이미지 첨부</button><span class="thumb" id="thumb" hidden><img id="thumbImg" alt=""><button class="ln" id="unpick" type="button">빼기</button></span></div>
    <span class="hint">복사한 프롬프트를 <a href="https://chatgpt.com/" target="_blank" rel="noopener">ChatGPT</a>나 <a href="https://claude.ai/new" target="_blank" rel="noopener">Claude</a>에 붙여 넣어요.</span>
  </div>
  <div class="col">
    <span class="lb">AI 답 붙여넣기</span>
    <textarea id="resIn" placeholder="받은 답을 그대로 붙여 넣기"></textarea>
    <div class="row"><button class="go" id="go" type="button">시트 만들기</button><span class="status" id="status"></span></div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</section>

<main class="pad">
  <div class="tools">
    <button class="ln" id="copyMd" type="button">마크다운 복사</button>
    <button class="ln" id="saveMd" type="button" hidden>.md 저장</button>
    <button class="ln" id="png" type="button" hidden>PNG 저장</button>
  </div>
  <div id="out"></div>
</main>

<dialog id="dlg">
  <div class="dh"><span class="x">기록</span><button class="ln" id="dlgClose" type="button">닫기</button></div>
  <ul class="hist" id="histList"></ul>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
{
const EXAMPLE={
 case:{title:"Cerence × Microsoft Mobile Work Agent",source:"Cerence AI · Microsoft 365 Copilot",
  headline:"이동 중 업무 흐름을 이어주는\n차량 Work AI Agent의\n선제형 맥락 오케스트레이션",
  description:"Cerence AI와 Microsoft의 Mobile Work AI Agent는 차량 안에서 Outlook 캘린더, Teams, OneNote 같은 업무 도구와 주행 맥락을 연결한다. 사용자가 말하기 전에 다음 회의 장소로의 이동이나 업무 전환을 먼저 제안하고, 음성만으로 회의 참여와 메일 작성이 이어진다."},
 keywords:{from:"도메인 분절",trend:"도메인 통합",future:"도메인 확장"},
 hev:{from:{h:"캘린더·내비게이션·업무 앱이 **각각 독립된 시스템**으로 작동하여",e:"일정이 바뀌면 탑승자가 스마트폰으로 직접 확인한 뒤 **내비게이션을 다시 검색·입력**하여",v:"탑승자는 이동 시간을 업무와 **단절된 공백**으로 인식한다"},
  trend:{h:"차량 AI가 캘린더·업무 도구·내비게이션·주행 상태를 **하나의 업무 맥락 레이어**로 통합 해석하여",e:"일정 기반 내비를 먼저 시작하고 회의 참여·메일 작성을 음성만으로 **연속 처리**하여",v:"탑승자는 이동 시간을 **업무 연속성이 유지되는 생산적 공간**으로 인식한다"}},
 future:{reinforce:{keyword:"업무 공간 그 자체",text:"업무 도구 연결을 넘어 탑승자의 **집중도·피로도·감정 상태**까지 읽어 최적의 업무 환경을 선제적으로 세팅하고, 차량 자체가 하나의 완전한 업무 공간이 된다."},
  expand:{keyword:"생활의 연속성",text:"업무 도메인에 한정되던 연결이 운동·식사·공부·휴식 같은 **다양한 생활 도메인**으로 넓어져, 차 안에서 생활의 흐름이 끊기지 않는다."}}
};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let data=structuredClone(EXAMPLE),sample=null,downloads=null,busy=false,curId=null,imgBlob=null;

const get=(o,p)=>p.split(".").reduce((a,k)=>a?.[k],o);
const put=(o,p,v)=>{const ks=p.split(".");const last=ks.pop();ks.reduce((a,k)=>a[k],o)[last]=v};
const ed=(p,tag="div",cls="")=>`<${tag} class="${cls}" contenteditable="true" spellcheck="false" data-p="${p}">${md(get(data,p))}</${tag}>`;

function render(){
  const date=new Date().toLocaleDateString("ko-KR");
  $("#out").innerHTML=`<article class="sheet" id="sheet">
    <div class="head">
      <div>${ed("case.headline","h2","ttl")}<div class="src">${ed("case.source","span")}</div></div>
      <div style="display:grid;gap:14px">${data.img?`<figure class="fig"><img src="${data.img}" alt="사례 이미지"></figure>`:""}${ed("case.description","p","desc")}</div>
    </div>
    <div class="tbl">
      <div class="ch"></div>
      <div class="ch"><span class="x" style="color:var(--mute)">From</span>${ed("keywords.from","span","kw")}</div>
      <div class="ch"><span class="x">Trend</span>${ed("keywords.trend","span","kw")}</div>
      <div class="ch fu"><span class="x">to Future</span>${ed("keywords.future","span","kw")}</div>
      ${["h","e","v"].map(k=>`<div class="rk">${k.toUpperCase()}</div>${ed("hev.from."+k,"div","t fr")}${ed("hev.trend."+k,"div","t")}`).join("")}
      <div class="fu body">
        <div><h4><span class="x">강화</span>${ed("future.reinforce.keyword","span")}</h4>${ed("future.reinforce.text","p")}</div>
        <div><h4><span class="x">확장</span>${ed("future.expand.keyword","span")}</h4>${ed("future.expand.text","p")}</div>
      </div>
    </div>
    <div class="foot"><span>${esc(data.case.title)}</span><span>${date}</span></div>
  </article>`;
}

function htmlToMd(h){
  const t=document.createElement("textarea");
  t.innerHTML=h.replace(/<\/?(b|strong)>/gi,"**").replace(/<br\s*\/?>/gi,"\n").replace(/<\/(div|p)>/gi,"\n").replace(/<[^>]+>/g,"");
  return t.value.replace(/\*\*\*\*/g,"").replace(/\n+$/,"");
}
$("#out").addEventListener("focusout",e=>{const el=e.target.closest("[data-p]");if(!el)return;
  const v=htmlToMd(el.innerHTML);if(v!==get(data,el.dataset.p)){put(data,el.dataset.p,v);saveHist()}});

const toMarkdown=d=>`# ${d.case.headline.replace(/\n/g," ")}

${d.case.title}${d.case.source?` · ${d.case.source}`:""}

${d.case.description}

| | From · ${d.keywords.from} | Trend · ${d.keywords.trend} |
|---|---|---|
${["h","e","v"].map(k=>`| **${k.toUpperCase()}** | ${d.hev.from[k]} | ${d.hev.trend[k]} |`).join("\n")}

**to Future · ${d.keywords.future}**
- 강화 · ${d.future.reinforce.keyword}: ${d.future.reinforce.text}
- 확장 · ${d.future.expand.keyword}: ${d.future.expand.text}
`;

const PROMPT=(caseText,focus,mode,hasImg)=>`너는 LG AIDV(AI-Defined Vehicle) 산학 프로젝트의 사례 분석가다. 아래 사례를 From–Trend–Future 형식으로 분석해 JSON 하나만 출력한다.

[사례]
${caseText}
${focus?`\n[분석 초점]\n${focus}\n`:""}${hasImg?"\n첨부 이미지도 사례 자료로 함께 읽는다.\n":""}
[규칙]
- Trend = 입력된 사례 자체. ${mode==="sota"?"From = Trend 직전의 가장 앞선 양산·상용 수준(SOTA). 원시적인 수동 조작 같은 먼 과거로 내려가지 않는다.":"From = 같은 일을 사람이 직접 하던 방식."}
- Future = Trend가 추구하는 본질을 밀어붙인 방향. 강화는 같은 도메인 안에서 Trend의 변화를 극한까지 밀었을 때, 확장은 같은 본질을 다른 도메인·맥락·대상으로 옮겼을 때. 솔루션이 아니라 기회의 방향으로 쓴다.
- 키워드(from/trend/future)는 2~6자 명사구 세 개가 하나의 축 위에서 단계적으로 변해야 한다. 예: 도메인 분절 → 도메인 통합 → 도메인 확장 / 명령 후 실행형 → 선제 제안형 → 즉시 실행형 / 직접 수행 → 자동 수행 → 예방적 개입.
- H(How, 무엇이 어떻게 작동하나)는 반드시 "~하여"로, E(Effect, 그래서 무엇이 일어나나)도 반드시 "~하여"로, V(Value, 사용자가 무엇으로 인식·체감하나)는 반드시 "~한다"로 끝난다. H·E·V를 이어 읽으면 "~하여 ~하여 ~한다"의 한 문장이 되어야 한다. "~하며", "~해", "~되어"로 끝내지 않는다. From과 Trend의 같은 행은 같은 대상을 두고 대구가 되게. 바뀐 핵심어 1~2개만 **굵게**.
- 번호 매기기, 잘게 쪼개기 금지. 큰 개념으로 한 문장씩.
- headline: 2~3줄(줄바꿈 \\n), 명사로 끝나는 무게 있는 제목. 예: "주행 중 실시간 데이터 환류로\\n플릿 전체의 판단력을 자기강화하는\\n차량 AI 학습 오케스트레이션"
- description: 사례 설명 3~4문장, 사실만. 모르는 수치·연도는 지어내지 않는다.
- 엠대시(—) 금지. 보고서체. 과장된 마케팅 어휘 금지.

[출력 JSON]
{"case":{"title":"짧은 사례명","source":"브랜드·기관(모르면 빈 문자열)","headline":"","description":""},
"keywords":{"from":"","trend":"","future":""},
"hev":{"from":{"h":"","e":"","v":""},"trend":{"h":"","e":"","v":""}},
"future":{"reinforce":{"keyword":"","text":"2~3문장"},"expand":{"keyword":"","text":"2~3문장"}}}`;

const valid=o=>o?.case&&o.keywords&&o.hev?.from&&o.hev?.trend&&o.future?.reinforce&&o.future?.expand;
function setStatus(t,err){const s=$("#status");s.textContent=t;s.classList.toggle("err",!!err)}

function parseResult(raw){
  const a=raw.indexOf("{"),b=raw.lastIndexOf("}");if(a<0||b<a)throw{message:"JSON이 안 보여요. 답 전체를 복사해 붙여 주세요."};
  let o;try{o=JSON.parse(raw.slice(a,b+1))}catch(e){throw{message:"답을 읽지 못했어요. 답 전체를 그대로 붙여 주세요."}}
  if(!valid(o))throw{message:"빠진 칸이 있어요. AI에게 '형식 그대로 JSON만 다시' 라고 해 주세요."};return o;
}
$("#copyPrompt").onclick=async()=>{
  const text=$("#caseIn").value.trim();if(!text){setStatus("사례를 먼저 넣어 주세요.",true);return}
  let p=PROMPT(text,"","sota",!!imgBlob);if(imgBlob)p+="\n\n(사례 이미지를 이 대화에 함께 첨부했다.)";
  const b=$("#copyPrompt");try{await navigator.clipboard.writeText(p);b.textContent="복사됨";setStatus(imgBlob?"AI 창에 붙여 넣고 이미지도 같이 올려 주세요.":"AI 창에 붙여 넣어 주세요.")}catch(e){b.textContent="복사 안 됨"}
  setTimeout(()=>b.textContent="프롬프트 복사",1600);
};
function generate(){
  try{const o=parseResult($("#resIn").value);if(imgUrl)o.img=imgUrl;data=o;curId=Date.now();render();saveHist();$("#resIn").value="";
    setStatus("완료. 글자를 눌러 고칠 수 있어요.");$("#out").scrollIntoView({behavior:"smooth"})}
  catch(e){setStatus(e.message||"실패했어요.",true)}
}
function saveHist(){if(!curId)return;let h=store.get("ftf-hist2",[]).filter(x=>x.id!==curId);h.unshift({id:curId,t:new Date().toISOString(),data});store.set("ftf-hist2",h.slice(0,30))}
function openHist(){
  const h=store.get("ftf-hist2",[]);
  $("#histList").innerHTML=h.length?h.map(x=>`<li><button class="o" data-id="${x.id}" type="button">${esc(x.data.case.title)}<small>${new Date(x.t).toLocaleString("ko-KR")} · ${esc(x.data.keywords.from)} → ${esc(x.data.keywords.trend)} → ${esc(x.data.keywords.future)}</small></button><button class="d" data-del="${x.id}" type="button">삭제</button></li>`).join(""):'<li style="padding:20px;color:var(--mute)">아직 없어요.</li>';
  $("#dlg").showModal();
}
$("#histList").addEventListener("click",e=>{
  const o=e.target.closest("[data-id]"),d=e.target.closest("[data-del]"),h=store.get("ftf-hist2",[]);
  if(o){const x=h.find(x=>x.id==o.dataset.id);if(x){data=x.data;curId=x.id;render();$("#dlg").close()}}
  if(d){store.set("ftf-hist2",h.filter(x=>x.id!=d.dataset.del));openHist()}
});
$("#histBtn").onclick=openHist;$("#dlgClose").onclick=()=>$("#dlg").close();

$("#caseIn").value=store.get("ftf-draft","");
$("#caseIn").addEventListener("input",()=>store.set("ftf-draft",$("#caseIn").value));
$("#go").onclick=generate;
$("#resIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))generate()});
let imgUrl=null;
async function takeImg(f){if(!f||!f.type?.startsWith("image/"))return;
  try{const bmp=await createImageBitmap(f),k=Math.min(1,1200/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    imgUrl=c.toDataURL("image/jpeg",.82);imgBlob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82))}catch(e){setStatus("이미지를 읽지 못했어요.",true);return}
  $("#thumbImg").src=imgUrl;$("#thumb").hidden=false;$("#pick").hidden=true}
$("#pick").onclick=()=>$("#file").click();
$("#file").onchange=e=>{takeImg(e.target.files[0]);e.target.value=""};
$("#unpick").onclick=()=>{imgBlob=null;imgUrl=null;$("#thumb").hidden=true;$("#pick").hidden=false};
const main=document.querySelector(".form .col");
main.addEventListener("dragover",e=>{e.preventDefault();main.classList.add("drag")});
main.addEventListener("dragleave",()=>main.classList.remove("drag"));
main.addEventListener("drop",e=>{e.preventDefault();main.classList.remove("drag");takeImg(e.dataTransfer.files[0])});
$("#caseIn").addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith("image/"));if(f){e.preventDefault();takeImg(f)}});

$("#copyMd").onclick=async()=>{const b=$("#copyMd");try{await navigator.clipboard.writeText(toMarkdown(data));b.textContent="복사됨"}catch(e){b.textContent="복사 안 됨"}setTimeout(()=>b.textContent="마크다운 복사",1500)};
async function save(filename,blob){
  if(downloads)return downloads.save({filename,data:blob});
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
const slug=()=>(data.case.title||"ftf").replace(/[^\w가-힣]+/g,"_").slice(0,40);
$("#saveMd").onclick=async()=>{try{await save(`FTF_${slug()}.md`,new Blob([toMarkdown(data)],{type:"text/markdown"}))}catch(e){}};
$("#png").onclick=async()=>{
  try{setStatus("이미지 만드는 중");const el=$("#sheet");
    const c=await html2canvas(el,{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor});
    const b=await new Promise(r=>c.toBlob(r,"image/png"));
    await save(`FTF_${slug()}.png`,b);setStatus("저장됨")}catch(e){setStatus("저장이 취소됐어요.",true)}
};

render();
(()=>{$("#saveMd").hidden=false;$("#png").hidden=false;
})();
}
</script>
</body>
</html>
